# Curated: which code belongs to which business system, and who owns it.
systems:
  - id: payments
    name: Payments Service
    paths: ["payments_service/**"]
    owners: ["@payments-team"]
    criticality: high
  - id: ledger
    name: Ledger Service
    paths: ["ledger_service/**", "migrations/**"]
    owners: ["@ledger-team"]
    criticality: high
  - id: customer
    name: Customer Profile Service
    paths: ["customer_service/**"]
    owners: ["@customer-team"]
    criticality: high
  - id: notifications
    name: Notification Service
    paths: ["notification_service/**"]
    owners: ["@notifications-team"]
    criticality: medium
  - id: reporting
    name: Regulatory Reporting Extract
    paths: ["reporting/**"]
    owners: ["@regreport-team"]
    criticality: high
  - id: platform
    name: Shared Platform Libraries
    paths: ["shared/**"]
    owners: ["@platform-team"]
    criticality: medium

# Jira components -> systems
components:
  Payments: payments
  Ledger: ledger
  Notifications: notifications
  Customer: customer
  Reporting: reporting

# People and roles used by controls (synthetic)
people:
  priya.nair: {name: Priya Nair, roles: [payments-lead]}
  mei.lim: {name: Mei Lim, roles: [regreport-lead]}
  daniel.tan: {name: Daniel Tan, roles: [privacy-officer]}
  wei.chen: {name: Wei Chen, roles: [developer]}
  arjun.k: {name: Arjun Kumar, roles: [developer]}
  sara.ong: {name: Sara Ong, roles: [developer]}
