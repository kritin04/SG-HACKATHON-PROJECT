# SYNTHETIC change controls: "if a change does X, then Y must happen". Not real regulation.
# At a real bank these come from change-management and compliance policies.
controls:
  - id: CTRL-PII
    name: Personal data change review
    when: The change touches a column labelled Personal or Secret
    triggers: {data_classes: ["Personal", "Personal (highly sensitive)", "Secret"]}
    requires: [Privacy Officer approval]
  - id: CTRL-PAY
    name: Payments logic change approval
    when: The change alters how payments or deposits are validated or recorded
    triggers: {services: [ledgerwriter]}
    requires: [Payments Lead approval, Automated tests for the change]
  - id: CTRL-API
    name: API contract change sign-off
    when: The change adds, removes or alters an API used by another service
    triggers: {api_contract_change: true}
    requires: [Sign-off from every consuming team]
  - id: CTRL-REG
    name: Regulatory reporting impact review
    when: The change affects data read by Regulatory Reporting
    triggers: {external_systems: [regulatory_reporting]}
    requires: [Regulatory Reporting team sign-off, Reconciliation test]
  - id: CTRL-VENDOR
    name: New third-party integration
    when: The change starts sending data to an outside vendor
    triggers: {external_systems: [sms_email_provider]}
    requires: [Vendor risk assessment, Security review]
