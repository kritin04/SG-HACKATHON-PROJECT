# SYNTHETIC: systems OUTSIDE this codebase that depend on it. We cannot change them,
# but a change can break them: notify the owner, test the interface, get sign-off.
# At a real bank this comes from the interface catalogue / architecture repository.
external_systems:
  - id: regulatory_reporting
    name: Regulatory Reporting
    description: Builds the daily transaction report sent to the regulator.
    consumes: ["table:ledger-db.transactions", "table:accounts-db.users"]
    owner: Regulatory Reporting team
    criticality: high
  - id: finance_ledger
    name: Finance General Ledger
    description: Books every customer transaction into the bank accounting ledger.
    consumes: ["table:ledger-db.transactions"]
    owner: Finance Systems team
    criticality: high
  - id: fraud_screening
    name: Fraud Screening
    description: Scores new transactions for fraud every few minutes.
    consumes: ["table:ledger-db.transactions"]
    owner: Financial Crime team
    criticality: high
  - id: crm
    name: Customer Relationship Management (CRM)
    description: Copies customer profiles every night for the call centre.
    consumes: ["table:accounts-db.users"]
    owner: Customer Operations team
    criticality: medium
  - id: sms_email_provider
    name: SMS / Email Provider
    description: Third-party service the bank can use to send messages to customers. Not connected yet.
    consumes: []
    owner: Vendor (managed by Digital Channels team)
    criticality: medium
